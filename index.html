<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>庫存進出表</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <h1>庫存進出表</h1>
      <p>資料儲存在此瀏覽器，可匯出 CSV 備份。</p>
    </div>
    <div class="header-actions">
      <button id="exportItemsBtn">匯出品項 CSV</button>
      <button id="exportTxBtn">匯出進出紀錄 CSV</button>
      <button id="backupBtn">完整備份 JSON</button>
      <label class="file-label">
        匯入備份
        <input id="restoreInput" type="file" accept=".json,application/json" />
      </label>
    </div>
  </header>

  <main class="container">
    <section class="cards">
      <div class="card stat"><span>品項數</span><strong id="itemCount">0</strong></div>
      <div class="card stat"><span>總庫存量</span><strong id="totalStock">0</strong></div>
      <div class="card stat warning"><span>低庫存品項</span><strong id="lowStockCount">0</strong></div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>新增 / 編輯品項</h2>
      </div>
      <form id="itemForm" class="grid-form">
        <input type="hidden" id="itemId" />
        <label>品項名稱
          <input id="itemName" required placeholder="例如：15 mL 離心管" />
        </label>
        <label>規格
          <input id="itemSpec" placeholder="例如：50 支/包" />
        </label>
        <label>單位
          <input id="itemUnit" required placeholder="例如：包、盒、瓶" />
        </label>
        <label>安全庫存
          <input id="itemMin" type="number" min="0" step="0.01" value="0" required />
        </label>
        <label>初始庫存
          <input id="itemStock" type="number" min="0" step="0.01" value="0" required />
        </label>
        <label>備註
          <input id="itemNote" placeholder="位置、廠牌、貨號等" />
        </label>
        <div class="form-actions">
          <button type="submit" class="primary">儲存品項</button>
          <button type="button" id="resetItemBtn">清除</button>
        </div>
      </form>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>入庫 / 出庫</h2>
      </div>
      <form id="txForm" class="grid-form">
        <label>日期
          <input id="txDate" type="date" required />
        </label>
        <label>品項
          <select id="txItem" required></select>
        </label>
        <label>類型
          <select id="txType">
            <option value="in">入庫</option>
            <option value="out">出庫</option>
          </select>
        </label>
        <label>數量
          <input id="txQty" type="number" min="0.01" step="0.01" required />
        </label>
        <label>操作者 / 領用人
          <input id="txPerson" placeholder="姓名" />
        </label>
        <label>備註
          <input id="txNote" placeholder="用途、批號、原因等" />
        </label>
        <div class="form-actions">
          <button type="submit" class="primary">新增紀錄</button>
        </div>
      </form>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>庫存總表</h2>
        <input id="itemSearch" class="search" placeholder="搜尋品項 / 規格 / 備註" />
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>品項</th>
              <th>規格</th>
              <th>單位</th>
              <th>安全庫存</th>
              <th>現有庫存</th>
              <th>狀態</th>
              <th>備註</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="itemTableBody"></tbody>
        </table>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>進出紀錄</h2>
        <div class="filters">
          <input id="txSearch" class="search" placeholder="搜尋品項 / 人員 / 備註" />
          <select id="txFilterType">
            <option value="">全部類型</option>
            <option value="in">入庫</option>
            <option value="out">出庫</option>
          </select>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>日期</th>
              <th>品項</th>
              <th>類型</th>
              <th>數量</th>
              <th>單位</th>
              <th>操作者 / 領用人</th>
              <th>備註</th>
              <th>建立時間</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="txTableBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer>
    <p>GitHub Pages 靜態版｜資料存在 localStorage。跨裝置/多人共用需另外接資料庫。</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
