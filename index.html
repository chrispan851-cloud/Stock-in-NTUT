<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>庫存領出 / 入庫</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <h1>庫存領出 / 入庫</h1>
      <p>可一次選多個品項，每個品項各自填數量，送出後拆成多筆 Google Form 回覆。</p>
    </div>
  </header>

  <main class="container">
    <section class="panel">
      <div class="panel-head">
        <h2>新增紀錄</h2>
        <span class="badge info">Google Form 模式</span>
      </div>

      <form id="recordForm">
        <div class="grid-form">
          <label>日期
            <input id="date" type="date" required />
          </label>

          <label>出入庫
            <select id="type" required>
              <option value="領出">領出</option>
              <option value="入庫">入庫</option>
            </select>
          </label>

          <label>負責人
            <select id="person" required></select>
          </label>

          <label>客戶
            <input id="customer" type="text" placeholder="可留空" />
          </label>

          <label>內容
            <input id="content" type="text" placeholder="可留空" />
          </label>

          <label>備註
            <input id="note" type="text" placeholder="可留空" />
          </label>

          <label>款項備註
            <input id="paymentNote" type="text" placeholder="可留空" />
          </label>
        </div>

        <div class="picker-section">
          <button id="itemPickerBtn" class="picker-button" type="button">
            <span id="pickerLabel">選擇品項</span>
            <span class="chevron">▼</span>
          </button>

          <div id="itemPickerPanel" class="picker-panel hidden">
            <div class="picker-tools">
              <input id="itemSearch" class="search" placeholder="搜尋品項" />
              <button type="button" id="clearItemsBtn">清除勾選</button>
            </div>
            <div id="itemList" class="item-list"></div>
          </div>
        </div>

        <div id="selectedArea" class="selected-area">
          <div class="selected-title">已選品項</div>
          <div id="selectedItemsBox" class="selected-items-box">
            <span class="muted">尚未選擇品項</span>
          </div>
        </div>

        <div class="submit-bar">
          <div id="selectedSummary">尚未選擇品項</div>
          <button id="submitBtn" type="submit" class="primary">送出到 Google Form</button>
        </div>
      </form>
    </section>

    <section class="panel compact-panel">
      <div class="panel-head">
        <div>
          <h2>庫存同步</h2>
          <div id="stockSyncText" class="sync-text">尚未讀取</div>
        </div>
        <button id="refreshStockBtn" type="button">重新整理庫存</button>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>送出狀態</h2>
      </div>
      <div id="statusBox" class="status-box">尚未送出資料。</div>
    </section>
  </main>

  <iframe name="googleFormSink" id="googleFormSink" class="hidden-frame"></iframe>
  <script src="app.js"></script>
</body>
</html>
